<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown to smoke-free</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #d6e9f3;
    --ink: #1b2a3a;
    --muted: #4f6476;
    --paper: #fbfbf8;
    --paper-edge: #dfe3e6;
    --filter: #d9a066;
    --filter-dot: #c48a4f;
    --ember: #e4572e;
    --ash: #8e959b;
    --smoke: rgba(120, 135, 150, 0.35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky: #13202d;
      --ink: #e8eff4;
      --muted: #9fb3c3;
      --paper: #eef0ef;
      --paper-edge: #b9c0c5;
      --smoke: rgba(200, 215, 230, 0.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  html { background: var(--sky); }
  body {
    background: transparent;
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    transition: color 1.5s;
  }
  main { width: 100%; max-width: 760px; text-align: center; }

  /* Sky and weather, behind everything */
  #sky { position: fixed; inset: 0; z-index: -1; background: var(--sky); transition: background 1.5s; }
  #wx { display: block; width: 100%; height: 100%; }

  h1 {
    font-size: clamp(1.9rem, 5.5vw, 3.4rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .greeting { margin-top: 0.7rem; font-size: clamp(1.05rem, 2.8vw, 1.35rem); font-weight: 600; }
  .greeting[hidden] { display: none; }
  .sub { margin-top: 2rem; color: var(--muted); font-size: 1.1rem; line-height: 1.5; }

  /* The cigarette */
  .cig-wrap { position: relative; margin: 4.5rem auto 0; height: 34px; }
  .cig-note { margin: 1rem 0 3rem; color: var(--muted); font-size: 0.95rem; }
  .cig { display: flex; height: 100%; align-items: stretch; }
  .filter {
    flex: 0 0 22%;
    background: radial-gradient(var(--filter-dot) 1px, transparent 1.5px) 0 0 / 6px 6px, var(--filter);
    border-radius: 6px 0 0 6px;
  }
  .paper {
    background: var(--paper);
    border-top: 1px solid var(--paper-edge);
    border-bottom: 1px solid var(--paper-edge);
    width: 78%;
    transition: width 1s linear;
  }
  .ash {
    flex: 0 0 14px;
    background: repeating-linear-gradient(90deg, var(--ash) 0 3px, #a9afb4 3px 5px);
    border-radius: 0 7px 7px 0;
    position: relative;
  }
  .ash::before {
    content: "";
    position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
    background: var(--ember);
    box-shadow: 0 0 12px 3px var(--ember);
    border-radius: 3px;
    animation: glow 2.4s ease-in-out infinite;
  }
  /* --drift is how far the smoke travels sideways; the weather code sets it from the wind */
  .smoke { position: absolute; right: 0; bottom: 100%; width: 40px; height: 70px; pointer-events: none; --drift: 6px; }
  .smoke span {
    position: absolute; bottom: 0; left: 50%;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--smoke);
    filter: blur(4px);
    animation: rise 4s ease-out infinite;
  }
  .smoke span:nth-child(2) { animation-delay: 1.3s; }
  .smoke span:nth-child(3) { animation-delay: 2.6s; }
  @keyframes rise {
    0%   { transform: translate(-50%, 0) scale(.6); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--drift)), -70px) scale(2.2); opacity: 0; }
  }
  @keyframes glow { 50% { box-shadow: 0 0 18px 5px var(--ember); } }

  /* Numbers */
  .clock { display: flex; justify-content: center; gap: clamp(1rem, 4vw, 2.75rem); flex-wrap: wrap; }
  .unit { min-width: 4.5ch; }
  .num {
    display: block;
    font-size: clamp(2.6rem, 9vw, 5rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .label { display: block; margin-top: 0.4rem; color: var(--muted); font-size: 1rem; }

  /* After the big day */
  body.done .cig-wrap, body.done .cig-note { display: none; }
  body.done .clock { margin-top: 3rem; }

  @media (prefers-reduced-motion: reduce) {
    .smoke { display: none; }
    .ash::before { animation: none; }
    .paper { transition: none; }
    body, #sky { transition: none; }
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"><canvas id="wx"></canvas></div>
<main>
  <h1 id="headline">Búcsú a cigitől</h1>
  <p class="greeting" id="greeting" hidden></p>

  <div class="cig-wrap" aria-hidden="true">
    <div class="cig">
      <div class="filter"></div>
      <div class="paper" id="paper"></div>
      <div class="ash"><div class="smoke" id="smoke"><span></span><span></span><span></span></div></div>
    </div>
  </div>
  <p class="cig-note">The cigarette burns down as the day gets closer.</p>

  <div class="clock" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">0</span><span class="label">days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="label">hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="label">minutes</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="label">seconds</span></div>
  </div>

  <p class="sub" id="sub">Countdown to 2nd January 2028</p>

</main>

<script>
  // ---- Edit these ----
  const TARGET = new Date(2028, 0, 2, 0, 0);  // 2 Jan 2028, midnight in the viewer's time zone
  const START  = new Date(2026, 9, 14);       // when the cigarette was "lit" (full length on this day)
  // --------------------

  const $ = id => document.getElementById(id);
  document.title = "Búcsú a cigitől";

  const pad = n => String(n).padStart(2, "0");

  function tick() {
    const now = new Date();
    let diff = TARGET - now;

    if (diff <= 0) {
      // Count up instead once she's quit
      document.body.classList.add("done");
      const since = now - TARGET;
      $("headline").textContent = "Füstmentes";
      $("sub").textContent = "Smoke-free since 2nd January 2028";
      diff = since;
    } else {
      const total = TARGET - START;
      const left = Math.min(1, Math.max(0, diff / total));
      $("paper").style.width = (78 * left) + "%";
    }

    const s = Math.floor(diff / 1000);
    $("d").textContent = Math.floor(s / 86400);
    $("h").textContent = pad(Math.floor(s / 3600) % 24);
    $("m").textContent = pad(Math.floor(s / 60) % 60);
    $("s").textContent = pad(s % 60);
  }

  tick();
  setInterval(tick, 1000);
</script>

<script>
/* =====================================================================
   Sky and weather
   Uses the same colours, weather codes and sunrise/sunset maths as the widget.
   Without location: a time-of-day sky on a fixed schedule (sunrise 6:00, sunset 19:30).
   With location (only passed in by the widget when its optional module is on):
   seasonal sunrise/sunset, the current weather animated, and smoke that leans with the wind.
   ===================================================================== */
(() => {
  const DAY = 86400000;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

  // ---------- Location from the widget link (after "#", never sent to GitHub) ----------
  function readLocation() {
    const p = new URLSearchParams(location.hash.slice(1));
    const lat = parseFloat(p.get("lat")), lon = parseFloat(p.get("lon"));
    let data = null;
    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
      const w = p.get("w");
      data = { lat: Math.round(lat * 10) / 10, lon: Math.round(lon * 10) / 10, w: w !== null && w !== "" && isFinite(+w) ? +w : null };
      try { sessionStorage.setItem("bucsu-loc", JSON.stringify(data)); } catch (e) {}
      // Tidy the address bar so the location isn't copied if the link is shared.
      // It's kept for this tab only, so a reload still has it.
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    } else {
      try { data = JSON.parse(sessionStorage.getItem("bucsu-loc")); } catch (e) {}
    }
    return data;
  }

  // ---------- Sky colours (same as the widget) ----------
  // [top of the sky, horizon]. A clear sky is blue overhead and paler near the horizon;
  // warm colours only appear low down, in roughly the hour either side of sunrise and sunset.
  const NIGHT   = ["#0b1424", "#18263d"];
  const PREDAWN = ["#121d36", "#2e3a63"];
  const DAWN    = ["#9db4da", "#f3bf9e"];
  const MORNING = ["#b5d6ee", "#e2edf3"];
  const MIDDAY  = ["#a9d1ee", "#dcecf6"];
  const GOLDEN  = ["#9fc3e2", "#f5d3a4"];
  const SUNSET  = ["#6c80b3", "#f2925f"];
  const DUSK    = ["#232b52", "#4b3d68"];
  const DEFAULT_SUN = { sunrise: 6, sunset: 19.5 };

  function skyKeyframes({ sunrise, sunset }) {
    const pts = [
      [0, NIGHT], [sunrise - 1, PREDAWN], [sunrise, DAWN], [sunrise + 1, MORNING],
      [(sunrise + sunset) / 2, MIDDAY], [sunset - 2, MIDDAY] /* blue all afternoon */,
      [sunset - 0.75, GOLDEN], [sunset, SUNSET], [sunset + 1, DUSK], [24, NIGHT],
    ];
    for (let i = 1; i < pts.length - 1; i++) {
      pts[i][0] = Math.min(Math.max(pts[i][0], pts[i - 1][0] + 0.1), 24 - (pts.length - 1 - i) * 0.1);
    }
    return pts;
  }

  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgbToHex = c => "#" + c.map(v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => { const B = hexToRgb(b); return hexToRgb(a).map((v, i) => v + (B[i] - v) * t); };

  function skyAt(date, frames) {
    const h = date.getHours() + date.getMinutes() / 60;
    let i = 0;
    while (h >= frames[i + 1][0]) i++;
    const [h0, [top0, bot0]] = frames[i], [h1, [top1, bot1]] = frames[i + 1];
    const t = (h - h0) / (h1 - h0);
    return [rgbToHex(mix(top0, top1, t)), rgbToHex(mix(bot0, bot1, t))];
  }

  function sunTimes(date, lat, lon) {
    const rad = Math.PI / 180;
    const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
    const N = Math.round((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / DAY);
    const decl = -23.44 * Math.cos(2 * Math.PI / 365 * (N + 10)) * rad;
    const B = 2 * Math.PI * (N - 81) / 364;
    const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) / (Math.cos(lat * rad) * Math.cos(decl));
    if (cosH <= -1 || cosH >= 1) return null;
    const halfDay = Math.acos(cosH) / rad / 15;
    const noonUTC = 12 - lon / 15 - eot / 60;
    const toLocal = h => { const t = new Date(Date.UTC(y, m, d) + h * 3600000); return t.getHours() + t.getMinutes() / 60; };
    return { sunrise: toLocal(noonUTC - halfDay), sunset: toLocal(noonUTC + halfDay) };
  }

  function weatherKind(code) {
    if (code == null) return null;
    if (code === 0) return "clear";
    if (code <= 2) return "partly";
    if (code === 3) return "overcast";
    if (code === 45 || code === 48) return "fog";
    if (code >= 51 && code <= 57) return "drizzle";
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
    if (code >= 95) return "storm";
    return null;
  }

  const TINT = {
    partly: [0.15, 0], overcast: [0.6, 0.05], fog: [0.65, -0.15], drizzle: [0.55, 0.08],
    rain: [0.65, 0.15], snow: [0.5, -0.1], storm: [0.7, 0.35],
  };
  function tint(hex, kind) {
    const t = TINT[kind];
    if (!t) return hex;
    const [r, g, b] = hexToRgb(hex);
    const grey = 0.3 * r + 0.59 * g + 0.11 * b;
    const des = [r, g, b].map(v => v + (grey - v) * t[0]);
    return rgbToHex(t[1] >= 0 ? des.map(v => v * (1 - t[1])) : des.map(v => v + (255 - v) * -t[1]));
  }

  function luminance(hex) {
    const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);

  // ---------- State ----------
  let loc = readLocation();
  let weather = { code: loc ? loc.w : null, windSpeed: 0, windDir: null };
  let kind = weatherKind(weather.code);
  let isNight = false;
  let windX = 0;  // km/h, positive = blowing to the right of the screen
  let sunToday = DEFAULT_SUN;

  function applySky() {
    const now = new Date();
    const sun = (loc && sunTimes(now, loc.lat, loc.lon)) || DEFAULT_SUN;
    sunToday = sun;
    const [baseTop, baseBottom] = skyAt(now, skyKeyframes(sun));
    const top = tint(baseTop, kind), bottom = tint(baseBottom, kind);
    const h = now.getHours() + now.getMinutes() / 60;
    isNight = h < sun.sunrise || h > sun.sunset;

    const root = document.documentElement.style;
    $("sky").style.background = `linear-gradient(${top}, ${bottom})`;
    root.setProperty("--sky", bottom);

    // Dark or light text, whichever stays more readable against both ends of the sky
    const worst = text => Math.min(contrast(luminance(text), luminance(top)), contrast(luminance(text), luminance(bottom)));
    const dark = worst("#1b2a3a") >= worst("#e8eff4");
    root.setProperty("--ink", dark ? "#1b2a3a" : "#e8eff4");
    root.setProperty("--muted", dark ? "#4f6476" : "#b4c4d1");
    root.setProperty("--smoke", dark ? "rgba(120, 135, 150, 0.35)" : "rgba(200, 215, 230, 0.25)");
    root.setProperty("color-scheme", dark ? "light" : "dark");
  }

  function applyWind() {
    windX = weather.windDir == null ? 0 : -Math.sin(weather.windDir * Math.PI / 180) * weather.windSpeed;
    const drift = Math.max(-50, Math.min(50, 6 + windX * 1.2));
    $("smoke").style.setProperty("--drift", drift.toFixed(1) + "px");
  }

  async function fetchWeather() {
    if (!loc) return;
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=weather_code,wind_speed_10m,wind_direction_10m&timezone=auto`);
      if (!r.ok) throw new Error(r.status);
      const c = (await r.json()).current;
      weather = { code: c.weather_code, windSpeed: c.wind_speed_10m || 0, windDir: c.wind_direction_10m };
    } catch (e) {
      // Offline or the service is down: keep the widget's reading
    }
    const newKind = weatherKind(weather.code);
    const changed = newKind !== kind;
    kind = newKind;
    applyWind();
    applySky();
    if (changed) build();
    if (reduceMotion.matches) drawFrame(0, 0);
  }

  // ---------- Animated weather ----------
  const canvas = $("wx"), ctx = canvas.getContext("2d");
  let W = 0, H = 0, P = {}, t = 0, nextFlash = 5, flash = 0, bolt = null;  // first flash after 5 seconds
  const rnd = (a, b) => a + Math.random() * (b - a);

  // A cloud drawn once in solid white, then stamped with transparency (no seams where puffs overlap)
  const cloud = document.createElement("canvas");
  cloud.width = 260; cloud.height = 110;
  (c => {
    c.fillStyle = "#fff";
    for (const [x, y, r] of [[60, 70, 36], [110, 50, 48], [165, 62, 40], [205, 78, 28], [95, 82, 28], [140, 84, 30]]) {
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
  })(cloud.getContext("2d"));

  function build() {
    const area = W * H, n = (per, max) => Math.min(max, Math.round(area / per));
    P = {};
    if (isNight && (kind === "clear" || kind === "partly")) {
      P.stars = Array.from({ length: n(9000, 160) }, () => ({ x: rnd(0, W), y: rnd(0, H * 0.75), r: rnd(0.5, 1.4), ph: rnd(0, 6.3), a: rnd(0.4, 0.9) }));
    }
    if (kind === "partly" || kind === "overcast") {
      P.clouds = Array.from({ length: kind === "partly" ? 5 : 9 }, () => ({ x: rnd(-260, W), y: rnd(-20, H * 0.4), s: rnd(0.6, kind === "partly" ? 1.2 : 1.8), v: rnd(0.7, 1.3) }));
    }
    if (kind === "fog") {
      P.fog = Array.from({ length: 7 }, (_, i) => ({ x: rnd(-W * 0.5, W), y: (i + 0.5) * H / 7 + rnd(-20, 20), w: rnd(W * 0.6, W * 1.2), v: rnd(0.6, 1.4) }));
    }
    if (kind === "drizzle" || kind === "rain" || kind === "storm") {
      const per = kind === "drizzle" ? 9000 : kind === "rain" ? 4500 : 3000;
      P.rain = Array.from({ length: n(per, 420) }, () => ({ x: rnd(-200, W + 200), y: rnd(0, H), v: rnd(0.8, 1.2) }));
    }
    if (kind === "snow") {
      P.snow = Array.from({ length: n(6000, 260) }, () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.2, 3.2), v: rnd(25, 60), ph: rnd(0, 6.3) }));
    }
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (reduceMotion.matches) drawFrame(0, 0);
  }

  // How the sun and moon show through each kind of weather: [disc opacity, glow strength, glow size].
  // Thicker cloud hides the disc and spreads its light into a wider, dimmer glow.
  const SKY_LIGHT = {
    clear:    [1,    1,    1],
    partly:   [1,    1,    1],     // clouds drift in front
    fog:      [0.55, 0.25, 0.7],   // a pale, crisp disc with almost no glow
    drizzle:  [0.2,  0.45, 1.6],
    overcast: [0.15, 0.4,  1.8],   // mostly a brighter patch of cloud
    snow:     [0.25, 0.45, 1.5],
    rain:     [0.06, 0.35, 2],
    storm:    [0,    0.18, 2.2],   // just a dim brighter patch behind the storm clouds
  };

  // Position on the arc across the sky: p = 0 at the left horizon, 1 at the right
  function arcPoint(p, r) {
    const elev = Math.sin(Math.PI * p);                     // 1 at the top, 0 on the horizon
    const horizon = H + r * 0.4, highest = H * 0.13;
    return {
      x: W * (0.1 + 0.8 * p),
      y: horizon - elev * (horizon - highest),
      low: 1 - Math.max(0, Math.min(1, elev / 0.45)),       // 0 high up, 1 at the horizon
    };
  }

  function drawLight(x, y, r, core, glowAlpha, glowR, animate, time, speed) {
    const [disc, glow, size] = SKY_LIGHT[kind] || SKY_LIGHT.clear;
    if (kind === "fog") core = rgbToHex(mix(core, "#ffffff", 0.6));
    const [cr, cg, cb] = hexToRgb(core);
    const breathe = animate ? 1 + 0.06 * Math.sin(time * speed) : 1;
    const haloR = r * glowR * size * breathe;
    const halo = ctx.createRadialGradient(x, y, r * 0.6, x, y, haloR);
    halo.addColorStop(0, `rgba(${cr},${cg},${cb},${glowAlpha * glow})`);
    halo.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(x, y, haloR, 0, Math.PI * 2); ctx.fill();
    if (disc > 0) {
      ctx.globalAlpha = disc;
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return disc;
  }

  const hoursNow = () => { const n = new Date(); return n.getHours() + n.getMinutes() / 60 + n.getSeconds() / 3600; };

  // The sun follows its real path for the day: it rises at the left, peaks at midday,
  // and sinks off the bottom of the screen at sunset, turning orange as it gets low.
  function drawSun(time, animate) {
    const p = (hoursNow() - sunToday.sunrise) / (sunToday.sunset - sunToday.sunrise);  // 0 at sunrise, 1 at sunset
    if (p < -0.05 || p > 1.05) return;
    const r = Math.max(22, Math.min(60, Math.min(W, H) * 0.07));
    const { x, y, low } = arcPoint(p, r);
    drawLight(x, y, r, rgbToHex(mix("#fff4d6", "#ff9a5a", low)), 0.45, 4.5, animate, time, 0.8);
  }

  // The moon: the sun's path in reverse. It rises at the left at sunset, peaks in the
  // middle of the night and sinks off the bottom at sunrise.
  function drawMoon(time, animate) {
    const nightLen = 24 - sunToday.sunset + sunToday.sunrise;
    let t = hoursNow() - sunToday.sunset;
    if (t < 0) t += 24;
    let p = t / nightLen;                       // 0 at sunset, 1 at sunrise
    if (p > 1.05) p = (t - 24) / nightLen;      // just before sunset, still below the horizon
    if (p < -0.05 || p > 1.05) return;
    const r = Math.max(19, Math.min(50, Math.min(W, H) * 0.06));
    const { x, y, low } = arcPoint(p, r);
    const disc = drawLight(x, y, r, rgbToHex(mix("#eef1f6", "#f3d9b5", low)), 0.25, 3.5, animate, time, 0.6);
    if (disc > 0) {
      // A few faint darker patches so it reads as the moon rather than a light
      ctx.globalAlpha = 0.35 * disc;
      ctx.fillStyle = "#b9c0cc";
      for (const [dx, dy, sz] of [[-0.35, -0.25, 0.38], [0.2, 0.15, 0.3], [-0.05, 0.45, 0.2]]) {
        ctx.beginPath(); ctx.arc(x + dx * r, y + dy * r, sz * r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Special days: a small decoration and a greeting under the headline ----------
  // Change NAME or a greeting here; each occasion is one line.
  const NAME = "Petra";

  // Easter Sunday for any year (the standard Gregorian calculation)
  function easterSunday(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }
  // The first Sunday of Advent: four Sundays before Christmas
  function firstAdvent(y) {
    const xmas = new Date(y, 11, 25), dow = xmas.getDay();
    return new Date(y, 11, 25 - (dow === 0 ? 7 : dow) - 21);
  }
  const daysBetween = (a, b) => Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / DAY);

  // text: the greeting (null for a decoration with no greeting that day)
  function occasionFor(d) {
    const m = d.getMonth() + 1, day = d.getDate(), y = d.getFullYear();
    if (m === 10 && day === 2)  return { key: "nameday",   text: `Boldog névnapot, ${NAME}!` };     // name day
    if (m === 10 && day === 31) return { key: "halloween", text: "Boldog Halloweent!" };
    if (m === 12 && day === 6)  return { key: "mikulas",   text: "Boldog Mikulást!" };              // St Nicholas
    if (m === 12 && day >= 24 && day <= 26) return { key: "christmas", text: "Boldog karácsonyt!" };
    if ((m === 12 && day === 31) || (m === 1 && day === 1)) return { key: "newyear", text: "Boldog új évet!" };
    if (m === 1 && day === 2)   return { key: "birthday",  text: `Boldog születésnapot, ${NAME}!` };
    if (m === 3 && day === 8)   return { key: "nonap",     text: "Boldog nőnapot!" };               // Women's Day
    if (m === 3 && day === 15)  return { key: "march15",   text: "Nemzeti ünnep, március 15." };    // 1848 revolution
    if (m === 8 && day === 20)  return { key: "stephen",   text: "Szent István napja" };            // St Stephen's Day
    const easter = daysBetween(easterSunday(y), d);
    if (easter === 0 || easter === 1) return { key: "easter", text: "Boldog húsvétot!" };          // Sunday and Monday
    const advent = daysBetween(firstAdvent(y), d);
    if (advent >= 0 && !(m === 12 && day > 23)) {                                                  // until Christmas Eve
      // One more candle each Sunday; the greeting only on the Sundays themselves
      return { key: "advent", candles: Math.min(4, 1 + Math.floor(advent / 7)), text: advent % 7 === 0 ? "Békés adventet!" : null };
    }
    return null;
  }

  let occ = null, decor = {};
  function applyOccasion() {
    const next = occasionFor(new Date());
    if ((next && next.key) !== (occ && occ.key)) decor = {};
    occ = next;
    const g = $("greeting"), text = occ && occ.text;
    g.textContent = text || "";
    g.hidden = !text;
  }

  // Decorations stay clear of the text: along the top edge, above the headline, or in the
  // bottom-right corner below everything else.
  const headTop = () => $("headline").getBoundingClientRect().top;
  const textBottom = () => $("sub").getBoundingClientRect().bottom;
  const decorSize = () => Math.max(28, Math.min(44, W * 0.075));
  function cornerSpot(size) {
    return { x: W - size * 1.4 - 14, y: Math.max(textBottom() + size * 1.6, H - size - 28) };
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function softGlow(x, y, r, hex, a) {
    const [cr, cg, cb] = hexToRgb(hex);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${cr},${cg},${cb},${a})`);
    g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function drawLights(dt, time, anim) {
    const spacing = Math.max(28, Math.min(44, W / 12)), span = spacing * 4, sag = Math.min(16, H * 0.025);
    const yAt = x => 2 + sag * Math.sin(Math.PI * (((x % span) + span) % span) / span);
    ctx.globalAlpha = 0.5; ctx.strokeStyle = "#2f3236"; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let x = 0; x <= W + 4; x += 4) (x ? ctx.lineTo(x, yAt(x)) : ctx.moveTo(x, yAt(x)));
    ctx.stroke();
    const colors = ["#ffd36e", "#ff8a7a", "#8fd3a8", "#8ec5ff"];
    let i = 0;
    for (let x = spacing / 2; x < W; x += spacing, i++) {
      const y = yAt(x) + 6, c = colors[i % 4];
      const tw = anim ? 0.6 + 0.4 * Math.sin(time * 1.6 + i * 1.9) : 0.9;   // a slow, gentle twinkle
      softGlow(x, y, 13, c, 0.45 * tw);
      ctx.globalAlpha = 0.55 + 0.45 * tw; ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(x, y, 3.3, 4.6, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPumpkin(cx, cy, s, lit) {
    if (lit > 0) softGlow(cx, cy, s * 2.8, "#ff9a3c", 0.3 * lit);
    for (const [dx, hw, c] of [[-0.5, 0.5, "#c95f1c"], [0.5, 0.5, "#c95f1c"], [-0.2, 0.55, "#e07b2c"], [0.2, 0.55, "#e07b2c"], [0, 0.5, "#ec8a36"]]) {
      ctx.globalAlpha = 1; ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(cx + dx * s, cy, hw * s, 0.8 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#5b6b3a"; ctx.fillRect(cx - 0.09 * s, cy - 1.05 * s, 0.18 * s, 0.32 * s);
    if (lit > 0) {   // the carved face glows after dark
      ctx.globalAlpha = 0.6 + 0.4 * lit; ctx.fillStyle = "#ffd36e";
      const tri = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(cx + x * s, cy + y * s) : ctx.moveTo(cx + x * s, cy + y * s))); ctx.closePath(); ctx.fill(); };
      tri([[-0.5, -0.05], [-0.2, -0.05], [-0.35, -0.32]]);
      tri([[0.2, -0.05], [0.5, -0.05], [0.35, -0.32]]);
      tri([[-0.5, 0.18], [-0.25, 0.32], [0, 0.2], [0.25, 0.32], [0.5, 0.18], [0, 0.5]]);
      ctx.globalAlpha = 1;
    }
  }

  function drawBat(x, y, flap) {
    const w = 14, lift = flap * 6;
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-w * 0.5, -6 - lift, -w, -2 - lift);
    ctx.quadraticCurveTo(-w * 0.75, 2, -w * 0.55, 1);
    ctx.quadraticCurveTo(-w * 0.4, 4, -w * 0.25, 2);
    ctx.quadraticCurveTo(-w * 0.12, 5, 0, 3);
    ctx.quadraticCurveTo(w * 0.12, 5, w * 0.25, 2);
    ctx.quadraticCurveTo(w * 0.4, 4, w * 0.55, 1);
    ctx.quadraticCurveTo(w * 0.75, 2, w, -2 - lift);
    ctx.quadraticCurveTo(w * 0.5, -6 - lift, 0, 0);
    ctx.globalAlpha = 0.88; ctx.fillStyle = "#14101a"; ctx.fill();
    if (isNight) { ctx.globalAlpha = 1; ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawHalloween(dt, time, anim) {
    const s = decorSize(), { x, y } = cornerSpot(s);
    const lit = isNight ? (anim ? 0.8 + 0.2 * Math.sin(time * 7.3) * Math.sin(time * 2.9) : 0.9) : 0;
    drawPumpkin(x, y, s, lit);
    // Every so often a bat flutters across the sky above the headline
    const b = decor.bat || (decor.bat = { active: false, next: 3 });
    if (!anim) { drawBat(W * 0.78, Math.max(H * 0.07, headTop() * 0.45), 0.3); return; }
    if (!b.active) {
      b.next -= dt;
      if (b.next <= 0) {
        b.active = true; b.dir = Math.random() < 0.5 ? 1 : -1; b.x = b.dir > 0 ? -30 : W + 30;
        b.base = rnd(H * 0.05, Math.max(H * 0.07, headTop() - 40)); b.ph = rnd(0, 6);
      }
    } else {
      b.x += b.dir * 80 * dt;
      drawBat(b.x, b.base + Math.sin(b.x / 45 + b.ph) * 12, Math.sin(time * 17));
      if (b.x < -40 || b.x > W + 40) { b.active = false; b.next = rnd(8, 14); }
    }
  }

  function drawBoot(dt, time, anim) {
    const s = decorSize(), { x, y } = cornerSpot(s);
    const sx = x + 0.17 * s, sy = y - 1.3 * s;
    if (anim) softGlow(sx, sy, s * 0.6, "#ffe08a", 0.25 + 0.2 * Math.sin(time * 2.2));
    ctx.globalAlpha = 1; ctx.fillStyle = "#e9b949";
    ctx.beginPath(); ctx.arc(sx, sy, 0.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c8323a";
    rr(x - 0.1 * s, y - 0.95 * s, 0.55 * s, 1.25 * s, 0.12 * s); ctx.fill();
    rr(x - 0.75 * s, y + 0.05 * s, 1.2 * s, 0.42 * s, 0.2 * s); ctx.fill();
    ctx.fillStyle = "#fbf7f2";
    rr(x - 0.2 * s, y - 1.1 * s, 0.75 * s, 0.3 * s, 0.14 * s); ctx.fill();
  }

  function drawFireworks(dt, time, anim, colors) {
    const ceiling = Math.max(H * 0.14, headTop() - 30);
    const f = decor.fw || (decor.fw = { bursts: [], next: 0.6 });
    if (!anim) {   // still scene: three settled bursts
      [[0.18, 0.5, 0], [0.78, 0.7, 1], [0.55, 0.3, 2]].forEach(([px, py, ci]) => {
        const bx = W * px, by = Math.max(14, ceiling * py), c = colors[ci], r = Math.min(46, W * 0.09);
        ctx.strokeStyle = c; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.4; ctx.beginPath();
        for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; ctx.moveTo(bx + Math.cos(a) * r * 0.35, by + Math.sin(a) * r * 0.35); ctx.lineTo(bx + Math.cos(a) * r, by + Math.sin(a) * r); }
        ctx.stroke(); ctx.globalAlpha = 1;
      });
      return;
    }
    f.next -= dt;
    if (f.next <= 0) {
      f.next = rnd(1.1, 2.4);
      const n = 26, sp = rnd(45, 75);
      f.bursts.push({ x: rnd(W * 0.08, W * 0.92), y: rnd(H * 0.05, ceiling), c: colors[Math.floor(Math.random() * colors.length)], t: 0,
        p: Array.from({ length: n }, (_, i) => ({ a: i / n * Math.PI * 2 + rnd(-0.08, 0.08), v: sp * rnd(0.85, 1.1) })) });
    }
    f.bursts = f.bursts.filter(b => (b.t += dt) < 1.8);
    for (const b of f.bursts) {
      const fade = Math.pow(1 - b.t / 1.8, 1.5), reach = 1 - Math.exp(-2.4 * b.t), droop = 16 * b.t * b.t;
      ctx.fillStyle = b.c; ctx.strokeStyle = b.c; ctx.lineWidth = 1;
      for (const q of b.p) {
        const px = b.x + Math.cos(q.a) * q.v * reach, py = b.y + Math.sin(q.a) * q.v * reach + droop;
        ctx.globalAlpha = 0.35 * fade;
        ctx.beginPath(); ctx.moveTo(b.x + Math.cos(q.a) * q.v * reach * 0.7, b.y + Math.sin(q.a) * q.v * reach * 0.7 + droop * 0.7); ctx.lineTo(px, py); ctx.stroke();
        ctx.globalAlpha = 0.9 * fade;
        ctx.beginPath(); ctx.arc(px, py, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // New Year's Eve night (until sunrise on the 1st)
  function drawNewYear(dt, time, anim) {
    const h = hoursNow(), m = new Date().getMonth();
    if ((m === 11 && h > sunToday.sunset) || (m === 0 && h < sunToday.sunrise)) drawFireworks(dt, time, anim, ["#ffd36e", "#ff9ab0", "#9fd8ff", "#c7a6ff", "#a8f0c6"]);
  }
  // St Stephen's Day: the kokárda by day, red, white and green fireworks in the evening
  function drawStephen(dt, time, anim) {
    if (hoursNow() > sunToday.sunset) drawFireworks(dt, time, anim, ["#e8414b", "#ffffff", "#4caf6a"]);
    else drawKokarda(dt, time, anim);
  }

  // A kokárda, the red-white-green rosette worn on Hungarian national days
  function drawKokarda(dt, time, anim) {
    const s = decorSize(), { x, y } = cornerSpot(s);
    const cy = y - s * 0.55, sway = anim ? Math.sin(time * 1.1) * 0.05 : 0;
    for (const dir of [-1, 1]) {
      ["#ce2939", "#ffffff", "#477050"].forEach((c, i) => {
        const wdt = s * 0.11;
        ctx.save(); ctx.translate(x, cy + s * 0.2); ctx.rotate(dir * 0.42 + sway);
        ctx.globalAlpha = 1; ctx.fillStyle = c; ctx.fillRect((i - 1) * wdt - wdt / 2, 0, wdt, s * 1.15);
        ctx.restore();
      });
    }
    for (const [r, c] of [[0.55, "#ce2939"], [0.38, "#ffffff"], [0.2, "#477050"]]) {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, cy, r * s, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Painted eggs (hímes tojás)
  function drawEggs(dt, time, anim) {
    const s = decorSize(), { x, y } = cornerSpot(s);
    const eggs = [[-0.75, 0.15, "#d94b4b", "#fbe3c8", -0.12], [0.75, 0.2, "#e9b949", "#d94b4b", 0.1], [0, -0.1, "#5b8fd6", "#fbf7f2", 0]];
    for (const [dx, dy, c, band, rot] of eggs) {
      const rx = s * 0.36, ry = s * 0.48;
      ctx.save(); ctx.translate(x + dx * s, y + dy * s); ctx.rotate(rot);
      ctx.globalAlpha = 1; ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.clip();   // keep the pattern inside the egg
      ctx.strokeStyle = band; ctx.lineWidth = Math.max(1.2, s * 0.05);
      ctx.beginPath();
      for (let i = 0; i <= 8; i++) { const px = -rx + i * rx / 4, py = (i % 2 ? -1 : 1) * s * 0.06; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
      ctx.fillStyle = band;
      for (const ddx of [-0.4, 0, 0.4]) for (const yy of [-ry * 0.5, ry * 0.45]) { ctx.beginPath(); ctx.arc(ddx * rx, yy, s * 0.04, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }

  // An Advent wreath: three purple candles and one pink, one more lit each Sunday
  function drawAdvent(dt, time, anim) {
    const s = decorSize(), { x, y } = cornerSpot(s);
    const cx = x, cy = y + s * 0.2, R = s * 1.1, Ry = s * 0.4;
    for (const [n, off, c, sz] of [[26, 0, "#3f6b3a", 0.32], [26, 0.5, "#5d8f52", 0.24]]) {
      ctx.globalAlpha = 1; ctx.fillStyle = c;
      for (let i = 0; i < n; i++) {
        const a = (i + off) / n * Math.PI * 2;
        ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * R, cy + Math.sin(a) * Ry, s * sz, s * sz * 0.6, a, 0, Math.PI * 2); ctx.fill();
      }
    }
    for (const [dx, dy, c, n] of [[-0.8, -0.05, "#7b5aa6", 1], [-0.3, -0.3, "#7b5aa6", 2], [0.3, -0.3, "#e7a1c4", 3], [0.8, -0.05, "#7b5aa6", 4]]) {
      const px = cx + dx * s, top = cy + dy * s - s * 0.9;
      ctx.globalAlpha = 1; ctx.fillStyle = c; rr(px - s * 0.12, top, s * 0.24, s * 0.9, s * 0.05); ctx.fill();
      if (n <= occ.candles) {
        const fl = anim ? 1 + 0.12 * Math.sin(time * 9 + n * 2) * Math.sin(time * 3.7 + n) : 1;   // a gentle flicker
        softGlow(px, top - s * 0.2, s * 0.6, "#ffd36e", 0.35);
        ctx.globalAlpha = 1; ctx.fillStyle = "#ffd36e";
        ctx.beginPath(); ctx.ellipse(px, top - s * 0.17 * fl, s * 0.08, s * 0.16 * fl, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawBalloons(dt, time, anim) {
    const s = Math.max(20, Math.min(34, W * 0.06)), { x, y } = cornerSpot(s);
    const ax = x, ay = y + s * 0.7;   // where the strings are tied
    const set = [[-1.5, -3.0, "#f28b82"], [0.4, -3.4, "#9ecbf0"], [-0.5, -3.9, "#fbd36b"], [1.3, -2.6, "#b8a2e3"]];
    set.forEach(([dx, dy, c], i) => {
      const sway = anim ? Math.sin(time * 0.9 + i * 1.7) * s * 0.25 : 0;
      const bx = ax + dx * s + sway, by = ay + dy * s + (anim ? Math.sin(time * 1.3 + i) * s * 0.08 : 0);
      ctx.globalAlpha = 0.6; ctx.strokeStyle = isNight ? "#c9cfd8" : "#6b7480"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 + s * 0.2, (ay + by) / 2, bx, by + s * 0.62); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(bx, by, s * 0.45, s * 0.56, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - s * 0.1, by + s * 0.64); ctx.lineTo(bx + s * 0.1, by + s * 0.64); ctx.lineTo(bx, by + s * 0.52); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.45; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(bx - s * 0.17, by - s * 0.2, s * 0.09, s * 0.16, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function drawBouquet(dt, time, anim) {
    const s = decorSize(), { x, y } = cornerSpot(s);
    const base = { x, y: y + s * 0.55 };
    const tilt = anim ? Math.sin(time * 0.8) * 0.035 : 0;   // a barely-there sway
    ctx.save(); ctx.translate(base.x, base.y); ctx.rotate(tilt);
    const heads = [[-0.75, -1.85, "#f4a6c0"], [0, -2.2, "#fff4f0"], [0.75, -1.8, "#f7b38a"], [-0.3, -1.4, "#fff4f0"], [0.4, -1.35, "#f4a6c0"]];
    ctx.strokeStyle = "#5f8f57"; ctx.lineWidth = Math.max(1.4, s * 0.06); ctx.globalAlpha = 1;
    ctx.beginPath(); for (const [dx, dy] of heads) { ctx.moveTo(0, 0); ctx.lineTo(dx * s, dy * s); } ctx.stroke();
    ctx.fillStyle = "#6fa86a";
    ctx.beginPath(); ctx.ellipse(-0.55 * s, -0.75 * s, 0.32 * s, 0.14 * s, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.55 * s, -0.7 * s, 0.32 * s, 0.14 * s, 0.5, 0, Math.PI * 2); ctx.fill();
    for (const [dx, dy, c] of heads) {
      const fx = dx * s, fy = dy * s, pr = 0.22 * s;
      ctx.fillStyle = c;
      for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; ctx.beginPath(); ctx.arc(fx + Math.cos(a) * pr * 1.1, fy + Math.sin(a) * pr * 1.1, pr, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = "#f6c453"; ctx.beginPath(); ctx.arc(fx, fy, pr * 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#f2c4d0"; rr(-0.25 * s, -0.55 * s, 0.5 * s, 0.32 * s, 0.1 * s); ctx.fill();
    ctx.restore();
  }

  function drawDecor(dt, time) {
    if (!occ) return;
    const anim = dt > 0;
    const draw = {
      christmas: drawLights, halloween: drawHalloween, mikulas: drawBoot, newyear: drawNewYear, birthday: drawBalloons,
      nameday: drawBouquet, nonap: drawBouquet, march15: drawKokarda, stephen: drawStephen, easter: drawEggs, advent: drawAdvent,
    }[occ.key];
    if (draw) draw(dt, time, anim);
  }

  const wrap = (v, min, max) => (v < min ? max - (min - v) % (max - min) : v > max ? min + (v - max) % (max - min) : v);

  function drawFrame(dt, time) {
    ctx.clearRect(0, 0, W, H);
    const glow = isNight ? 0.5 : 1;

    if (P.stars) {
      ctx.fillStyle = "#fff";
      for (const s of P.stars) {
        ctx.globalAlpha = s.a * (dt ? 0.65 + 0.35 * Math.sin(time * 1.3 + s.ph) : 0.85);
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
    }

    drawSun(time, dt > 0);
    drawMoon(time, dt > 0);

    if (P.clouds) {
      ctx.globalAlpha = (kind === "partly" ? 0.45 : 0.18) * glow;
      for (const c of P.clouds) {
        c.x += (6 + windX * 0.8) * c.v * dt;
        c.x = wrap(c.x, -260 * c.s, W + 10);
        ctx.drawImage(cloud, c.x, c.y, 260 * c.s, 110 * c.s);
      }
    }

    if (P.fog) {
      for (const f of P.fog) {
        f.x += (4 + windX * 0.3) * f.v * dt;
        f.x = wrap(f.x, -f.w, W + f.w * 0.2);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0, `rgba(255,255,255,${0.22 * glow})`);
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.save();
        ctx.translate(f.x + f.w / 2, f.y);
        ctx.scale(f.w / 2, 38);
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    if (P.rain) {
      const vy = kind === "drizzle" ? 380 : 820;
      const len = kind === "drizzle" ? 9 : 18;
      const vx = Math.max(-260, Math.min(260, windX * 6));
      ctx.globalAlpha = (kind === "drizzle" ? 0.3 : 0.38) * glow;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = kind === "drizzle" ? 1 : 1.3;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (const d of P.rain) {
        d.y += vy * d.v * dt; d.x += vx * d.v * dt;
        if (d.y > H + len) { d.y = rnd(-60, -len); d.x = rnd(-200, W + 200); }
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - (vx / vy) * len, d.y - len);
      }
      ctx.stroke();
    }

    if (P.snow) {
      ctx.fillStyle = "#fff";
      ctx.globalAlpha = 0.85 * (isNight ? 0.75 : 1);
      for (const f of P.snow) {
        f.y += f.v * dt;
        f.x += (Math.sin(time * 0.9 + f.ph) * 14 + windX * 1.5) * dt;
        if (f.y > H + 5) { f.y = -5; f.x = rnd(0, W); }
        f.x = wrap(f.x, -5, W + 5);
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      }
    }

    drawDecor(dt, time);

    // Lightning: a soft glow rather than a hard strobe, with a bolt in a
    // different place each time, kept to the outer edges so it isn't behind the text
    if (kind === "storm" && dt) {
      nextFlash -= dt;
      if (nextFlash <= 0) { flash = 1; nextFlash += rnd(6, 9); bolt = makeBolt(); }  // then every 6 to 9 seconds
      if (flash > 0) {
        ctx.globalAlpha = 0.28 * flash;
        ctx.fillStyle = "#fffbe6";
        ctx.fillRect(0, 0, W, H);
        if (bolt) drawBolt(bolt, flash);
        flash = Math.max(0, flash - dt * 2.8);
      }
    }
    ctx.globalAlpha = 1;
  }

  function makeBolt() {
    const x0 = Math.random() < 0.5 ? rnd(W * 0.04, W * 0.24) : rnd(W * 0.76, W * 0.96);
    // Stop above the headline so the bolt never reaches the text or the cigarette
    const ceiling = $("headline").getBoundingClientRect().top - 16;
    const bottom = Math.max(60, rnd(0.6, 1) * ceiling), steps = 6, jig = Math.min(26, W * 0.04 + 6);
    const pts = [[x0, -4]];
    let x = x0;
    for (let i = 1; i <= steps; i++) {
      x += (i % 2 ? 1 : -1) * rnd(jig * 0.4, jig) + rnd(-4, 4);
      pts.push([x, -4 + (bottom + 4) * i / steps]);
    }
    const [fx, fy] = pts[3], dir = Math.random() < 0.5 ? -1 : 1;
    const fork = [[fx, fy], [fx + dir * jig * 0.8, fy + bottom * 0.1], [fx + dir * jig * 1.2, fy + bottom * 0.22]];
    return { pts, fork };
  }

  function drawBolt(b, strength) {
    ctx.strokeStyle = "#fffbe6";
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const [width, alpha] of [[9, 0.22], [2.6, 0.95]]) {
      ctx.globalAlpha = alpha * strength;
      ctx.lineWidth = width;
      ctx.beginPath();
      for (const line of [b.pts, b.fork]) line.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  let raf = 0, last = 0;
  function loop(ts) {
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts; t += dt;
    drawFrame(dt, t);
    raf = requestAnimationFrame(loop);
  }
  function start() {
    cancelAnimationFrame(raf); last = 0;
    if (reduceMotion.matches) { drawFrame(0, 0); return; }  // a still scene for reduced motion
    raf = requestAnimationFrame(loop);
  }

  // Pause when the page isn't visible, to save battery
  document.addEventListener("visibilitychange", () => (document.hidden ? cancelAnimationFrame(raf) : start()));
  reduceMotion.addEventListener?.("change", start);
  addEventListener("resize", resize);
  // If the widget is tapped again while this tab is open, pick up the fresh location
  addEventListener("hashchange", () => { const l = readLocation(); if (l) { loc = l; weather.code = l.w; fetchWeather(); } });

  applyOccasion();
  applyWind();
  applySky();
  resize();
  start();
  fetchWeather();
  setInterval(() => {                       // the sky changes slowly, so once a minute is plenty
    const wasNight = isNight;
    applyOccasion();
    applySky();
    if (wasNight !== isNight) build();
    if (reduceMotion.matches) drawFrame(0, 0);  // keep the still scene's sun in the right place
  }, 60000);
  setInterval(fetchWeather, 15 * 60000);    // fresh weather every 15 minutes
})();
</script>
</body>
</html>
